name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--no-default-features"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy${{ matrix.features }}
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  # The full suite once (ubuntu, default features). Every other job runs the
  # binary's unit tests, and on macOS (where clippy does not run) also checks
  # that the integration tests build.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, features: "", suite: full }
          - { os: ubuntu-latest, features: "--no-default-features", suite: bins }
          - { os: macos-latest, features: "", suite: bins, check: true }
          - { os: macos-latest, features: "--no-default-features", suite: bins, check: true }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test${{ matrix.features }}
      - if: matrix.suite == 'full'
        run: cargo test
      - if: matrix.suite == 'bins'
        run: cargo test --bins ${{ matrix.features }}
      - if: matrix.check
        run: cargo check --tests ${{ matrix.features }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
