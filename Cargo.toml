[package]
name = "pinto-rs"
version = "0.12.5"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Proximity-based Interaction Network analysis for Tissue Organization"
repository = "https://github.com/causalpathlab/pinto-rs"
homepage = "https://github.com/causalpathlab/pinto-rs"
readme = "README.md"
keywords = ["genomics", "spatial", "single-cell", "link-community"]
categories = ["science", "command-line-utilities"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
    "temp*/**",
]

[[bin]]
name = "pinto"
path = "src/main.rs"

[features]
default = ["view"]
# `pinto view`: multi-resolution viewer for pinto outputs.
view = [
    "dep:png",
    "dep:ratatui",
    "dep:ratatui-image",
    "dep:image",
    "dep:flate2",
    "dep:base64",
    "dep:pdf-writer",
]
cuda = [
    "legume-numeric/cuda",
    "graph-embedding-util/cuda",
]
metal = [
    "legume-numeric/metal",
    "graph-embedding-util/metal",
]
hdf5 = ["data-beans/hdf5"]

[dependencies]
data-beans = { version = "0.7.3", features = ["aux", "alg"] }
legume-numeric = { version = "0.8.12", features = ["matrix", "param", "candle", "mcmc"] }
graph-embedding-util = { version = "0.8.4", package = "legume-graph-embedding" }
parquet = "59"
arrow-array = "59"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

dashmap = { version = "6.1.0", features = ["rayon"] }
anyhow = "1.0"
clap = { version = "4.5.20", features = ["derive"] }
rayon = "1.10.0"
tempfile = "3.2"
rand = "0.10.1"
ndarray = { version = "0.17", features = ["rayon", "serde", "approx", "blas"] }
rand_distr = "0.6"
nalgebra = "0.34"
nalgebra-sparse = "0.11"
wide = "0.7"

special = "0.13"
indicatif = { version = "^0.18", features = ["rayon"] }
log = "0.4"
colored = "3"
rustc-hash = "2.1"

png = { version = "0.18", optional = true }
ratatui = { version = "0.30", optional = true }
ratatui-image = { version = "11.1", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25", optional = true, default-features = false }
flate2 = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
pdf-writer = { version = "0.15", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
