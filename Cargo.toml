[package]
name = "pinto-rs"
version = "0.17.24"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Proximity-derived Interaction Network analysis for Tissue Organization"
repository = "https://github.com/causalpathlab/pinto-rs"
readme = "README.md"
keywords = ["genomics", "spatial", "single-cell", "link-community"]
categories = ["science", "command-line-utilities"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
    "temp*/**",
]

[[bin]]
name = "pinto"
path = "src/main.rs"

[features]
default = ["view"]
# `pinto view`: multi-resolution viewer for pinto outputs.
view = [
    "dep:ratatui",
    "dep:ratatui-image",
    "dep:image",
    "dep:pdf-writer",
    "dep:legume-tui",
    "dep:legume-mcp",
]
cuda = [
    "legume-numeric/cuda",
    "graph-embedding-util/cuda",
]
metal = [
    "legume-numeric/metal",
    "graph-embedding-util/metal",
]
hdf5 = ["data-beans/hdf5"]

[dependencies]
data-beans = { version = "0.14", default-features = false, features = ["aux", "alg", "tensor", "sim"] }
legume-numeric = { version = "0.10.16", features = ["matrix", "param", "candle", "mcmc"] }
graph-embedding-util = { version = "0.14", package = "legume-graph-embedding" }
# Per-cell covariates as a second axis of batch, shared with senna and chickpea.
genomic-data = { version = "0.6.5", package = "legume-genomic-types" }
parquet = "59"
arrow-array = "59"
arrow-schema = "59"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

anyhow = "1.0"
clap = { version = "4.5.20", features = ["derive"] }
rayon = "1.10.0"
# Manifests are written to a temporary file and renamed over the old one.
tempfile = "3.2"
rand = "0.10.1"
rand_distr = "0.6"
nalgebra = "0.34"
nalgebra-sparse = "0.11"

special = "0.13"
indicatif = { version = "^0.18", features = ["rayon"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
log = "0.4"
colored = "3"
rustc-hash = "2.1"
# The ligand-effect reference (`lr_activity::ligand_effect::reference`):
# fetching its sources once into the cache (no gzip transfer encoding, so
# the cached bytes are the server's), hashing them, and reading HCOP's
# gzipped table. flate2 also serves the viewer's PDF figures.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.11"
dirs = "6"
flate2 = "1"

ratatui = { version = "0.30", optional = true }
ratatui-image = { version = "11.1", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }
pdf-writer = { version = "0.15", optional = true }
# Detachable sessions for `pinto run` and `pinto view`, and what the
# viewers share: the file browser, map colours, screen styles, kitty graphics and block
# characters, the structure plot and heatmap and their PDF figures, the
# save field, the gallery of saved figures and the shell words of a
# command line. The same floor as in [dev-dependencies].
legume-tui = { version = "0.5", optional = true, features = ["browse", "form", "save", "gallery", "map-kitty", "chart", "export"] }

# `pinto mcp`: the Model Context Protocol on stdio, and the feed
# `pinto view --follow` reads.
legume-mcp = { version = "0.7", optional = true }
ciborium = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The crate's harness, driving `pinto run` and `pinto view` through
# pseudo-terminals in tests/detach_session.rs; the same floor as above.
legume-tui = { version = "0.5", default-features = false, features = ["testing"] }
# The MCP tests decode the images the viewer's tools reply with.
base64 = "0.22"

# Tests run the crate a little optimised and its dependencies more, so the
# suite's small fits stay quick without a release build.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 2
